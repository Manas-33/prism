name: eval

on:
  push:
    branches: [main, features]
  pull_request:

jobs:
  impact-detection-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      # Graph-only eval: no GitHub/Redis/LLM secrets required.
      # Gate on the current baseline so any regression fails CI.
      - name: Run impact-detection eval
        run: >
          uv run python -m eval
          --json eval-report.json
          --fail-under-precision 1.0
          --fail-under-recall 0.75

      - name: Upload metrics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
